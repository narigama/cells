[package]
name = "cells"
version = "0.1.0"
edition = "2024"
description = "Terminal spreadsheet with mouse support, menus, Excel formulas, and pixel charts"

[lib]
name = "cells"
path = "src/lib.rs"

[[bin]]
name = "cells"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = "3.4"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
csv = "1.3"
dirs = "6.0"
image = { version = "0.25", default-features = false, features = ["png"] }
ironcalc = "0.9.1"
ironcalc_base = "0.9.1"
plotters = { version = "0.3.7", default-features = false, features = [
    "bitmap_backend",
    "bitmap_encoder",
    "svg_backend",
    "ab_glyph",
    "line_series",
    "area_series",
    "point_series",
    "full_palette",
] }
ratatui = "0.30"
ratatui-image = { version = "11.1.0", default-features = false, features = [
    "image-defaults",
    "crossterm",
] }
parquet = { version = "60", default-features = false, features = [
    "snap",
    "flate2-zlib-rs",
    "lz4",
] }
rusqlite = "0.42"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "0.8"
zip = { version = "9.5", default-features = false, features = [
    "deflate-flate2",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Strip DWARF debug symbols from third-party crates to keep `target/debug` compact, and optimize
# IronCalc + CSV in dev builds so `cargo run` / `cargo test` keep release-speed sheet evaluation.
[profile.dev.package."*"]
debug = false

[profile.dev.package.ironcalc_base]
opt-level = 2

[profile.dev.package.ironcalc]
opt-level = 2

[profile.dev.package.csv]
opt-level = 2

# SGR-Pixels (?1016h) emits 1-based pixel coords; prevent debug underflow if a terminal sends 0 at edge.
[profile.dev.package.crossterm]
overflow-checks = false
